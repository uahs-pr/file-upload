<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>自动解密加密器 - AES + 防调试</title>
<style>
textarea{width:95%;height:400px;margin:10px}
button{padding:8px 30px;font-size:16px;cursor:pointer}
.copy-btn{margin-left:10px;padding:4px 14px;font-size:14px;cursor:pointer}
#output{width:95%;height:400px;margin:10px}
label{font-size:16px;margin-right:10px}
input[type="password"]{width:300px;padding:8px;font-size:16px;margin:10px}
</style>
</head>
<body>
<div class="glass header">
  <div class="title" style="font-size:22px;color:#fff;text-shadow:0 0 6px #0cf,0 0 12px #0cf,0 0 24px #0088ff;">发发制作</div>
  <div class="author" style="font-size:18px;color:#fff;text-shadow:0 0 5px #ff3699,0 0 10px #ff3699,0 0 20px #ff0066;">旺旺848108099</div>
  <div class="author">自动解密版</div>
</div>
<h3>粘贴完整HTML源码（无需任何修改）</h3>
<textarea id="input" placeholder="把你的完整HTML源码粘贴到这里..."></textarea>
<br>
<label for="password">设置加密密码：</label>
<input type="password" id="password" placeholder="例如: 123456">
<br>
<label for="protection">反调试保护：</label>
<select id="protection">
  <option value="none">无保护（仅加密）</option>
  <option value="light" selected>轻度保护（禁用右键+F12）</option>
  <option value="medium">中度保护（+检测DevTools，跳转空白）</option>
  <option value="strong">重度保护（+无限debugger循环，慎用）</option>
</select>
<br><br>
<button onclick="runEncode()">生成自动解密页面</button>
<button class="copy-btn" onclick="copyOutput()">复制结果</button>
<h3>输出加密后的完整代码</h3>
<textarea id="output" readonly></textarea>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script>
// ----- 工具函数 -----
function utf8ToB64(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
    function(m, p1){return String.fromCharCode('0x'+p1)}));
}

// ----- 生成反调试脚本-----
function generateAntiDebugScript(level){
  if(level === 'none') return '';
  let script = '';
  script += `
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('selectstart', function(e){ e.preventDefault(); });
document.addEventListener('copy', function(e){ e.preventDefault(); });
document.addEventListener('cut', function(e){ e.preventDefault(); });
document.addEventListener('paste', function(e){ e.preventDefault(); });
document.addEventListener('keydown', function(e){
  if(e.key === 'F12' ||
     (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
     (e.ctrlKey && e.key === 'u') ||
     (e.ctrlKey && e.shiftKey && e.key === 'i') ){
    e.preventDefault();
    return false;
  }
});
`;
  if(level === 'light') return script;
  if(level === 'medium' || level === 'strong'){
    script += `
(function detectDevTools(){
  var threshold = 150;
  var check = function(){
    var widthThreshold = window.outerWidth - window.innerWidth > threshold;
    var heightThreshold = window.outerHeight - window.innerHeight > threshold;
    if(widthThreshold || heightThreshold){
     document.body.innerHTML = '<h1 style="color:red;text-align:center;margin-top:200px;">🚫（已检测到调试工具，页面已关闭）若是手机请不要放大页面。</h1>';
    }
  };
  setInterval(check, 1000);
  check();
})();
`;
  }
  if(level === 'strong'){
    script += `
(function infiniteDebugger(){
  function trigger(){ debugger; setTimeout(trigger, 80); }
  setTimeout(trigger, 3500);
})();
`;
  }
  return script;
}

// ----- 主加密函数（AES + 自动解密）-----
function runEncode(){
  let originalHtml = document.getElementById('input').value;
  if(!originalHtml.trim()){ alert('请先粘贴HTML源码'); return; }
  let userPassword = document.getElementById('password').value;
  if(!userPassword.trim()){ alert('请设置密码'); return; }
  let protectionLevel = document.getElementById('protection').value;

  // 1. 生成反调试脚本并注入到原始HTML
  let antiDebugScript = generateAntiDebugScript(protectionLevel);
  let finalHtml = originalHtml;
  if(antiDebugScript){
    finalHtml = originalHtml.replace('</head>', `<script>${antiDebugScript}<\/script>\n</head>`);
  }

  // 2. AES-256-CBC 加密
  const salt = CryptoJS.lib.WordArray.random(128/8);
  const iv = CryptoJS.lib.WordArray.random(128/8);
  const key = CryptoJS.PBKDF2(userPassword, salt, {
    keySize: 256/32,
    iterations: 100000,
    hasher: CryptoJS.algo.SHA256
  });
  
  const encrypted = CryptoJS.AES.encrypt(finalHtml, key, {
    iv: iv,
    mode: CryptoJS.mode.CBC,
    padding: CryptoJS.pad.Pkcs7
  });
  
  const saltB64 = salt.toString(CryptoJS.enc.Base64);
  const ivB64 = iv.toString(CryptoJS.enc.Base64);
  const cipherB64 = encrypted.ciphertext.toString(CryptoJS.enc.Base64);

  // 3. 生成自动解密壳
  let wrap = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安全页面</title>
<style>
  body{background:#0f172a;color:#fff;text-align:center;padding-top:50px;font-family:sans-serif}
  #loading{font-size:18px;margin-top:20px}
  #app{display:none}
</style>
</head>
<body>
<div id="loading">页面加载中...</div>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"><\/script>
<script>
// 加密数据
var ENCRYPTED_DATA = {
  s: "${saltB64}",
  i: "${ivB64}",
  d: "${cipherB64}"
};

// 自动解密
(function(){
  try{
    var salt = CryptoJS.enc.Base64.parse(ENCRYPTED_DATA.s);
    var iv = CryptoJS.enc.Base64.parse(ENCRYPTED_DATA.i);
    var key = CryptoJS.PBKDF2("${userPassword}", salt, {
      keySize: 256/32,
      iterations: 100000,
      hasher: CryptoJS.algo.SHA256
    });
    var cipherParams = CryptoJS.lib.CipherParams.create({
      ciphertext: CryptoJS.enc.Base64.parse(ENCRYPTED_DATA.d)
    });
    var decrypted = CryptoJS.AES.decrypt(cipherParams, key, {
      iv: iv,
      mode: CryptoJS.mode.CBC,
      padding: CryptoJS.pad.Pkcs7
    });
    var raw = decrypted.toString(CryptoJS.enc.Utf8);
    if(!raw) throw new Error('解密失败');
    
    // 渲染页面
    var tempDiv = document.createElement('div');
    tempDiv.innerHTML = raw;
    var scripts = tempDiv.querySelectorAll('script');
    var scriptContents = [];
    scripts.forEach(function(s){
      scriptContents.push(s.textContent || s.innerHTML || '');
      s.parentNode && s.parentNode.removeChild(s);
    });
    var appDiv = document.getElementById('app');
    appDiv.innerHTML = tempDiv.innerHTML;
    appDiv.style.display = 'block';
    document.getElementById('loading').style.display = 'none';
    scriptContents.forEach(function(code){
      if(code.trim()){
        try{
          var globalEval = eval;
          globalEval(code);
        }catch(e){}
      }
    });
  }catch(e){
    document.getElementById('loading').innerText = '解密失败：' + e.message;
  }
})();
<\/script>
</body>
</html>`;

  document.getElementById('output').value = wrap;
}

// ----- 复制功能 -----
function copyOutput(){
  let out = document.getElementById('output');
  out.select();
  document.execCommand('copy');
  alert('已复制到剪贴板');
}
</script>
</body>
</html>
