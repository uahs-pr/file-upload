<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>加密器 - 最终</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  padding: 20px;
}
.glass {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
  padding: 25px;
  margin-bottom: 20px;
  text-align: center;
}
.glass .title {
  font-size: 26px;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 0 6px #0cf, 0 0 12px #0cf, 0 0 24px #0088ff;
  margin-bottom: 5px;
}
.glass .author {
  font-size: 16px;
  color: #ff8ec7;
  text-shadow: 0 0 5px #ff3699, 0 0 10px #ff3699, 0 0 20px #ff0066;
  margin-bottom: 3px;
}
.glass .desc {
  font-size: 14px;
  color: #94a3b8;
  margin-top: 5px;
}
h3 {
  font-size: 16px;
  color: #cbd5e1;
  margin: 15px 0 8px 0;
}
textarea {
  width: 100%;
  height: 220px;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.05);
  color: #fff;
  font-size: 14px;
  font-family: "Courier New", monospace;
  resize: vertical;
  outline: none;
}
textarea:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
}
.row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 12px 0;
}
label {
  font-size: 15px;
  color: #cbd5e1;
  white-space: nowrap;
}
input[type="password"], input[type="number"] {
  padding: 10px 14px;
  font-size: 15px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.05);
  color: #fff;
  outline: none;
}
input[type="password"] { width: 260px; }
input[type="number"] { width: 70px; }
input:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
}
select {
  padding: 10px;
  font-size: 15px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.15);
  background: #1e293b;
  color: #fff;
  outline: none;
}
button {
  padding: 11px 34px;
  font-size: 16px;
  font-weight: 600;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
.btn-primary {
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  color: #fff;
  box-shadow: 0 4px 15px rgba(59,130,246,0.3);
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(59,130,246,0.4);
}
.btn-copy {
  padding: 6px 18px;
  font-size: 14px;
  background: linear-gradient(135deg, #10b981, #059669);
  color: #fff;
  margin-left: 10px;
  box-shadow: 0 4px 15px rgba(16,185,129,0.3);
}
.btn-copy:hover {
  transform: translateY(-1px);
}
.btn-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 15px 0;
  flex-wrap: wrap;
}
#output {
  height: 240px;
  background: rgba(0,0,0,0.3);
}
.hint {
  font-size: 13px;
  color: #64748b;
}
</style>
</head>
<body>

<div class="glass">
  <div class="title">🔐 加密器</div>
  <div class="author">发发制作 | 旺旺848108099</div>
  <div class="desc">AES-256-CBC + PBKDF2 + 防暴破 + 有效期 + DOMContentLoaded</div>
</div>

<h3>📋 粘贴完整HTML源码</h3>
<textarea id="input" placeholder="把完整HTML源码粘贴到这里..."></textarea>

<div class="row">
  <label for="password">🔑 设置访问密码：</label>
  <input type="password" id="password" placeholder="例如: 123456">
</div>

<div class="row">
  <label for="expireDays">⏰ 有效期（天）：</label>
  <input type="number" id="expireDays" value="0" min="0" max="365">
  <span class="hint">（0 = 永不过期）</span>
</div>

<div class="row">
  <label for="protection">🛡️ 反调试保护：</label>
  <select id="protection">
    <option value="none">无保护（仅加密）</option>
    <option value="light" selected>轻度保护（禁用右键+F12）</option>
    <option value="medium">中度保护（+检测DevTools）</option>
    <option value="strong">重度保护（+无限debugger）</option>
  </select>
</div>

<div class="btn-row">
  <button class="btn-primary" onclick="runEncode()">🚀 生成加密页面</button>
  <button class="btn-copy" onclick="copyOutput()">📋 复制结果</button>
  <span id="status" class="hint"></span>
</div>

<h3>📤 输出加密后的完整代码</h3>
<textarea id="output" readonly placeholder="生成的加密页面代码会出现在这里..."></textarea>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script>
// ========== 工具函数 ==========
function utf8ToB64(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
    function(m, p1){ return String.fromCharCode('0x'+p1); }));
}

// ========== 生成反调试脚本 ==========
function generateAntiDebugScript(level){
  if(level === 'none') return '';
  let script = '';
  script += `
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('selectstart', function(e){ e.preventDefault(); });
document.addEventListener('copy', function(e){ e.preventDefault(); });
document.addEventListener('cut', function(e){ e.preventDefault(); });
document.addEventListener('paste', function(e){ e.preventDefault(); });
document.addEventListener('keydown', function(e){
  if(e.key === 'F12' ||
     (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
     (e.ctrlKey && e.key === 'u') ||
     (e.ctrlKey && e.shiftKey && e.key === 'i') ){
    e.preventDefault();
    return false;
  }
});
`;
  if(level === 'light') return script;
  if(level === 'medium' || level === 'strong'){
    script += `
(function detectDevTools(){
  var threshold = 150;
  var check = function(){
    var widthThreshold = window.outerWidth - window.innerWidth > threshold;
    var heightThreshold = window.outerHeight - window.innerHeight > threshold;
    if(widthThreshold || heightThreshold){
      document.body.innerHTML = '<h1 style="color:red;text-align:center;margin-top:200px;">🚫 调试工具已检测到，页面已关闭。</h1>';
    }
  };
  setInterval(check, 1000);
  check();
})();
`;
  }
  if(level === 'strong'){
    script += `
(function infiniteDebugger(){
  function trigger(){ debugger; setTimeout(trigger, 60); }
  setTimeout(trigger, 3200);
})();
`;
  }
  return script;
}

// ========== 主加密函数 ==========
function runEncode(){
  let originalHtml = document.getElementById('input').value;
  if(!originalHtml.trim()){ alert('请先粘贴HTML源码'); return; }
  let userPassword = document.getElementById('password').value;
  if(!userPassword.trim()){ alert('请设置密码'); return; }
  let protectionLevel = document.getElementById('protection').value;
  let expireDays = parseInt(document.getElementById('expireDays').value) || 0;

  setStatus('加密中...');

  // 1. 生成反调试脚本
  let antiDebugScript = generateAntiDebugScript(protectionLevel);
  
  // 2. 构建payload（原始HTML + 有效期）
  let expireTimestamp = expireDays > 0 ? Date.now() + expireDays * 86400000 : 0;
  let payloadObj = {
    html: originalHtml,
    exp: expireTimestamp
  };
  let htmlToEncrypt = originalHtml;
  if(antiDebugScript){
    if(htmlToEncrypt.indexOf('</head>') !== -1){
      htmlToEncrypt = htmlToEncrypt.replace('</head>', '<script>' + antiDebugScript + '<\/script>\n</head>');
    } else {
      htmlToEncrypt = '<script>' + antiDebugScript + '<\/script>' + htmlToEncrypt;
    }
  }
  payloadObj.html = htmlToEncrypt;
  
  let payloadJson = JSON.stringify(payloadObj);

  // 3. AES-256-CBC 加密
  const salt = CryptoJS.lib.WordArray.random(128/8);
  const iv = CryptoJS.lib.WordArray.random(128/8);
  const key = CryptoJS.PBKDF2(userPassword, salt, {
    keySize: 256/32,
    iterations: 80000,
    hasher: CryptoJS.algo.SHA256
  });
  
  const encrypted = CryptoJS.AES.encrypt(payloadJson, key, {
    iv: iv,
    mode: CryptoJS.mode.CBC,
    padding: CryptoJS.pad.Pkcs7
  });
  
  const saltB64 = salt.toString(CryptoJS.enc.Base64);
  const ivB64 = iv.toString(CryptoJS.enc.Base64);
  const cipherB64 = encrypted.ciphertext.toString(CryptoJS.enc.Base64);

  // 4. 生成解密壳（悬浮卡片 + 防暴破 + 有效期 + 手动触发DOMContentLoaded/load）
  let wrap = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安全页面</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0f172a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
  #app{display:none;width:100%;min-height:100vh}
  #loginOverlay{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,0.65);backdrop-filter:blur(10px);
    display:flex;align-items:center;justify-content:center;z-index:9999
  }
  .login-card{
    background:linear-gradient(145deg,#1e293b,#0f172a);
    border:1px solid rgba(255,255,255,0.1);border-radius:20px;
    padding:38px 33px;width:330px;
    box-shadow:0 25px 55px rgba(0,0,0,0.45),0 0 42px rgba(56,120,235,0.09);
    text-align:center;animation:fadeIn 0.44s ease
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}
  .login-card .icon{font-size:46px;margin-bottom:13px}
  .login-card h3{font-size:19px;margin-bottom:7px;color:#fff}
  .login-card .sub{font-size:12px;color:#8899aa;margin-bottom:23px}
  .login-card input{
    width:100%;padding:13px 15px;font-size:15px;
    border:1px solid rgba(230,240,255,0.17);border-radius:11px;
    background:rgba(245,250,255,0.04);color:#eee;outline:none;
    transition:border-color 0.28s,box-shadow 0.27s;margin-bottom:18px;box-sizing:border-box
  }
  .login-card input:focus{border-color:#3a78f0;box-shadow:0 0 0 3px rgba(58,120,232,0.21)}
  .login-card input::placeholder{color:#556677}
  .login-card button{
    width:100%;padding:13px;font-size:15px;font-weight:600;
    background:linear-gradient(133deg,#3878ea,#2255cc);color:#fff;
    border:none;border-radius:11px;cursor:pointer;
    transition:transform 0.18s,box-shadow 0.2s;
    box-shadow:0 4px 14px rgba(52,115,233,0.29)
  }
  .login-card button:hover{transform:translateY(-1px);box-shadow:0 6px 19px rgba(53,116,234,0.39)}
  .login-card .error{color:#ee4455;font-size:13px;margin-top:11px;min-height:19px}
  #loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-51%);font-size:17px;color:#8899aa;display:none;z-index:9998}
</style>
</head>
<body>
<div id="loginOverlay">
  <div class="login-card">
    <div class="icon">🔒</div>
    <h3>访问受限</h3>
    <div class="sub">请输入密码查看内容</div>
    <input type="password" id="passInput" placeholder="输入密码" autocomplete="off">
    <button onclick="checkLogin()">确认进入</button>
    <div class="error" id="errorMsg"></div>
  </div>
</div>
<div id="loading">解密中...</div>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"><\/script>
<script>
var ENCRYPTED_DATA = {
  s: "${saltB64}",
  i: "${ivB64}",
  d: "${cipherB64}"
};
var MAX_ATTEMPTS = 5;
var LOCK_TIME = 3660000;
var ATTEMPT_KEY = '_att_' + "${saltB64}".slice(0,10);

function getAttemptData(){
  var data = localStorage.getItem(ATTEMPT_KEY);
  if(data){ try{ return JSON.parse(data); }catch(e){} }
  return {count:0, lockUntil:0};
}
function saveAttemptData(data){
  localStorage.setItem(ATTEMPT_KEY, JSON.stringify(data));
}

function checkLogin() {
  var attempt = getAttemptData();
  var now = Date.now();
  
  if(attempt.lockUntil > now){
    var remain = Math.ceil((attempt.lockUntil - now)/61000);
    document.getElementById('errorMsg').innerText = '密码错误次数过多，请 '+remain+' 分钟后重试';
    return;
  }
  
  var inputPass = document.getElementById('passInput').value;
  var errorMsg = document.getElementById('errorMsg');
  
  try{
    var salt = CryptoJS.enc.Base64.parse(ENCRYPTED_DATA.s);
    var iv = CryptoJS.enc.Base64.parse(ENCRYPTED_DATA.i);
    // ★★★ ★★★
    var key = CryptoJS.PBKDF2(inputPass, salt, {
      keySize: 256/32,
      iterations: 80000,
      hasher: CryptoJS.algo.SHA256
    });
    var cipherParams = CryptoJS.lib.CipherParams.create({
      ciphertext: CryptoJS.enc.Base64.parse(ENCRYPTED_DATA.d)
    });
    var decrypted = CryptoJS.AES.decrypt(cipherParams, key, {
      iv: iv,
      mode: CryptoJS.mode.CBC,
      padding: CryptoJS.pad.Pkcs7
    });
    
    var jsonStr = decrypted.toString(CryptoJS.enc.Utf8);
    if(!jsonStr) throw new Error('密码错误');
    
    var payload = JSON.parse(jsonStr);
    if(!payload.html) throw new Error('数据损坏');
    
    // 
    if(payload.exp > 0 && Date.now() > payload.exp){
      document.getElementById('loginOverlay').innerHTML = '<div class="login-card"><div class="icon">⏰</div><h3>页面已过期</h3><p style="color:#8899aa">请联系发布者获取新版</p></div>';
      return;
    }
    
    // 
    saveAttemptData({count:0, lockUntil:0});
    
    // 
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('loading').style.display = 'block';
    
    // =====  =====
    var raw = payload.html;
    var tempDiv = document.createElement('div');
    tempDiv.innerHTML = raw;
    
    var scripts = tempDiv.querySelectorAll('script');
    var scriptContents = [];
    scripts.forEach(function(s){
      scriptContents.push(s.textContent || s.innerHTML || '');
      s.parentNode && s.parentNode.removeChild(s);
    });
    
    var appDiv = document.getElementById('app');
    appDiv.innerHTML = tempDiv.innerHTML;
    appDiv.style.display = 'block';
    document.getElementById('loading').style.display = 'none';
    
    // ===== =====
    scriptContents.forEach(function(code){
      if(code.trim()){
        try{
          var globalEval = eval;
          globalEval(code);
        }catch(e){
          console.warn('脚本执行出错:', e);
        }
      }
    });

    // =====  =====
    setTimeout(function(){
      try {
        document.dispatchEvent(new Event('DOMContentLoaded', {bubbles:true}));
      }catch(err){}
      try {
        window.dispatchEvent(new Event('load', {bubbles:true}));
      }catch(err){}
    }, 0);
    
  }catch(e){
    attempt.count++;
    if(attempt.count >= MAX_ATTEMPTS){
      attempt.lockUntil = Date.now() + LOCK_TIME;
      errorMsg.innerText = '密码错误次数过多，已锁定1小时';
    } else {
      errorMsg.innerText = '密码错误，剩余尝试 ' + (MAX_ATTEMPTS - attempt.count) + ' 次';
    }
    saveAttemptData(attempt);
    document.getElementById('passInput').value = '';
    document.getElementById('passInput').focus();
  }
}

document.getElementById('passInput').addEventListener('keydown', function(e) {
  if(e.key === 'Enter') checkLogin();
});
<\/script>
</body>
</html>`;

  document.getElementById('output').value = wrap;
  setStatus('✅ 生成完成！点击"复制结果"按钮复制代码。');
}

// ========== 复制功能==========
function copyOutput(){
  let out = document.getElementById('output');
  if(!out.value.trim()){ alert('没有可复制的内容，请先生成加密页面'); return; }
  out.select();
  document.execCommand('copy');
  setStatus('📋 已复制到剪贴板！');
  setTimeout(function(){ setStatus(''); }, 2700);
}

function setStatus(msg){
  document.getElementById('status').innerText = msg;
}
</script>
</body>
</html>
