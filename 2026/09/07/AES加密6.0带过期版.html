<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>发发无限制短信测压</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#0b0b1a;display:flex;justify-content:center;align-items:center;padding:20px}
#particles-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app-wrapper{position:relative;z-index:1;width:100%;max-width:500px;margin:0 auto}
.glass-card{background:rgba(255,255,255,0.06);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-radius:48px;padding:32px 28px 40px;border:1px solid rgba(255,255,255,0.15);box-shadow:0 20px 60px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.1)}
.header{text-align:center;margin-bottom:28px}
.header h1{font-size:28px;font-weight:700;letter-spacing:1px;background:linear-gradient(135deg,#f0e6ff,#c084fc,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(167,139,250,0.3)}
.header .sub{font-size:13px;color:rgba(255,255,255,0.3);margin-top:4px;letter-spacing:1px}
.input-group{margin-bottom:16px}
.input-group label{display:block;font-size:13px;font-weight:500;color:rgba(255,255,255,0.6);margin-bottom:6px;letter-spacing:0.3px}
.input-group input,.input-group select{width:100%;padding:15px 18px;background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.08);border-radius:20px;font-size:16px;color:#fff;outline:none;transition:all 0.3s ease;font-family:inherit}
.input-group input::placeholder{color:rgba(255,255,255,0.25)}
.input-group input:focus{border-color:rgba(167,139,250,0.5);background:rgba(255,255,255,0.08);box-shadow:0 0 0 4px rgba(167,139,250,0.06)}
.input-group input[type="password"]{letter-spacing:2px}
.input-group select option{background:#1a1a2e;color:#fff}
.btn-primary{width:100%;padding:17px;border:none;border-radius:24px;font-size:17px;font-weight:600;color:#fff;background:linear-gradient(135deg,#7c3aed,#a78bfa);cursor:pointer;transition:all 0.3s ease;box-shadow:0 8px 24px rgba(124,58,237,0.25);letter-spacing:1px;margin-top:8px}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(124,58,237,0.35)}
.btn-primary:active{transform:scale(0.97)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none!important}
.log-box{margin-top:24px;background:rgba(0,0,0,0.3);border-radius:24px;padding:16px 18px;max-height:240px;overflow-y:auto;border:1px solid rgba(255,255,255,0.05)}
.log-box::-webkit-scrollbar{width:4px}
.log-box::-webkit-scrollbar-thumb{background:rgba(167,139,250,0.3);border-radius:10px}
.log-item{padding:7px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.04);color:rgba(255,255,255,0.6);word-break:break-all;line-height:1.5}
.log-item:last-child{border-bottom:none}
.log-item.success{color:#34d399}
.log-item.error{color:#f87171}
.log-item.info{color:#a78bfa}
.footer{text-align:center;margin-top:20px;font-size:11px;color:rgba(255,255,255,0.15);letter-spacing:1px}
.footer span{color:rgba(255,255,255,0.2)}
@media(max-width:480px){.glass-card{padding:24px 18px 32px;border-radius:32px}.header h1{font-size:22px}}
</style>
</head>
<body>
<canvas id="particles-canvas"></canvas>
<div class="app-wrapper">
<div class="glass-card">
<div class="header">
<h1>✦ 发发无限制短信测压 ✦</h1>
<div class="sub"> 无限制短信测压</div>
</div>
<form id="sendForm">
<div class="input-group">
<label>📱 手机号码</label>
<input type="password" id="phone" placeholder="11位手机号" maxlength="11" required>
</div>
<div class="input-group">
<label>🔁 发送次数</label>
<input type="number" id="times" value="1" min="1" max="999">
</div>
<div class="input-group">
<label>⚡ 并发数</label>
<input type="number" id="concurrent" value="5" min="1" max="50">
</div>
<div class="input-group">
<label>⏱️ 间隔 (秒)</label>
<select id="delay">
<option value="0">无间隔</option>
<option value="0.5">0.5 秒</option>
<option value="1" selected>1 秒</option>
<option value="2">2 秒</option>
<option value="3">3 秒</option>
</select>
</div>
<button type="submit" class="btn-primary" id="sendBtn">🚀 开始测压</button>
</form>
<div class="log-box" id="logArea">
<div class="log-item info">✦ 等待操作 ...</div>
</div>
<div class="footer"><span>© 发发短信测压 · 仅限授权测试</span></div>
</div>
</div>
<script>
(function(){var c=document.getElementById("particles-canvas"),ctx=c.getContext("2d");var w,h,ps=[];function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}resize();window.addEventListener("resize",resize);for(var i=0;i<80;i++){ps.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-0.5)*0.8,vy:(Math.random()-0.5)*0.8,r:Math.random()*2+1,a:Math.random()*0.6+0.2})}function draw(){ctx.clearRect(0,0,w,h);ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle="rgba(167,139,250,"+p.a+")";ctx.fill()});for(var i=0;i<ps.length;i++){for(var j=i+1;j<ps.length;j++){var dx=ps[i].x-ps[j].x;var dy=ps[i].y-ps[j].y;var d=Math.sqrt(dx*dx+dy*dy);if(d<120){ctx.beginPath();ctx.moveTo(ps[i].x,ps[i].y);ctx.lineTo(ps[j].x,ps[j].y);ctx.strokeStyle="rgba(167,139,250,"+(1-d/120)*0.3+")";ctx.lineWidth=0.8;ctx.stroke()}}}requestAnimationFrame(draw)}draw()})();
var logArea=document.getElementById("logArea");function addLog(msg,type){type=type||"info";var d=document.createElement("div");d.className="log-item "+type;d.textContent=msg;logArea.appendChild(d);logArea.scrollTop=logArea.scrollHeight;while(logArea.children.length>200){logArea.removeChild(logArea.firstChild)}}function clearLogs(){logArea.innerHTML="";addLog("✦ 日志已清空","info")}
var API_BASE=https://hz.vyle.eu.cc/;document.getElementById("sendForm").addEventListener("submit",async function(e){e.preventDefault();var btn=document.getElementById("sendBtn");var phone=document.getElementById("phone").value.trim();var times=parseInt(document.getElementById("times").value)||1;var concurrent=parseInt(document.getElementById("concurrent").value)||5;var delay=parseFloat(document.getElementById("delay").value)||1;if(!/^\d{11}$/.test(phone)){addLog("❌ 手机号格式错误","error");return}if(times<1||times>999){addLog("❌ 次数1~999","error");return}btn.disabled=true;btn.textContent="⏳ 发送中...";addLog("🚀 开始测压: "+phone+" × "+times+" 次 (并发"+concurrent+", 间隔"+delay+"s)","info");try{var resp=await fetch(API_BASE+"/api/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:phone,times:times,concurrent:concurrent,delay:delay})});var result=await resp.json();if(result.code===0){addLog("✅ "+result.msg,"success");if(result.results&&result.results.length>0){var ok=result.results.filter(function(r){return r.ok});var fail=result.results.filter(function(r){return!r.ok});if(ok.length>0){addLog("  ✅ 成功 "+ok.length+" 条","success")}if(fail.length>0){addLog("  ❌ 失败 "+fail.length+" 条: "+fail.map(function(r){return r.msg}).join("; "),"error")}}}else{addLog("❌ "+result.msg,"error")}}catch(err){addLog("❌ 请求异常: "+err.message,"error")}finally{btn.disabled=false;btn.textContent="🚀 开始测压"}});
document.querySelector(".header h1").addEventListener("dblclick",function(){clearLogs()});
addLog("✦ 系统就绪，请填写信息后发送","info");
</script>
</body>
</html>
