<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发发分分🌟9尾数杀组</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
:root{
--bg-primary:rgba(255,255,255,0.9);--bg-secondary:rgba(248,249,250,0.8);--text-primary:#1a1a2e;--text-secondary:#4a4a6a;
--border-color:rgba(0,0,0,0.06);--success:#00c851;--danger:#ff4444;--kill:#ff4444;--card:rgba(255,255,255,0.92);
--shadow:0 8px 32px rgba(0,0,0,0.06);--blur:blur(20px);--gradient:linear-gradient(135deg,#fff 0%,#f8f9ff 100%);
--btn-active:#1a1a2e;--btn-inactive:#f0f0f5;--particle:#1a1a2e;--neon:rgba(26,26,46,0.2);
}
[theme="铂银"]{
--bg-primary:rgba(245,247,250,0.9);--bg-secondary:rgba(235,238,242,0.8);--text-primary:#2a2a2a;--text-secondary:#5a5a5a;
--border-color:rgba(0,0,0,0.08);--card:rgba(255,255,255,0.9);--shadow:0 8px 32px rgba(0,0,0,0.08);
--gradient:linear-gradient(135deg,#f5f7fa 0%,#e4eaf5 100%);--particle:#2a2a2a;--neon:rgba(42,42,42,0.2);
}
[theme="白银"]{
--bg-primary:rgba(250,250,252,0.95);--bg-secondary:rgba(240,240,245,0.85);--text-primary:#1a1a2e;--text-secondary:#4a4a6a;
--border-color:rgba(0,0,0,0.06);--card:rgba(255,255,255,0.92);--gradient:linear-gradient(135deg,#fff 0%,#f8f9ff 100%);
--particle:#1a1a2e;--neon:rgba(26,26,46,0.2);
}
[theme="黑钢"]{
--bg-primary:rgba(30,30,40,0.9);--bg-secondary:rgba(40,40,55,0.8);--text-primary:#fff;--text-secondary:#b0b0c0;
--border-color:rgba(255,255,255,0.1);--kill:#ff6b6b;--card:rgba(50,50,65,0.85);--shadow:0 8px 32px rgba(0,0,0,0.3);
--gradient:linear-gradient(135deg,#2c3e50 0%,#1a1a2e 100%);--btn-active:#fff;--btn-inactive:#404055;--particle:#fff;--neon:rgba(255,255,255,0.2);
}
[theme="黑洞"]{
--bg-primary:rgba(10,10,18,0.95);--bg-secondary:rgba(20,20,30,0.85);--text-primary:#e0e0ff;--text-secondary:#8080a0;
--border-color:rgba(255,255,255,0.08);--kill:#ff5252;--card:rgba(30,30,45,0.9);--shadow:0 8px 32px rgba(0,0,0,0.4);
--gradient:linear-gradient(135deg,#0f0f1e 0%,#1a1a2e 100%);--particle:#ff5252;--neon:rgba(255,82,82,0.3);
}
[theme="混沌"]{
--bg-primary:rgba(20,15,35,0.92);--bg-secondary:rgba(35,25,50,0.82);--text-primary:#f0e6ff;--text-secondary:#b8a0d8;
--border-color:rgba(255,255,255,0.1);--kill:#ff79b0;--card:rgba(45,35,65,0.88);--shadow:0 8px 32px rgba(0,0,0,0.35);
--gradient:linear-gradient(135deg,#1a1033 0%,#2d1b69 100%);--particle:#ff79b0;--neon:rgba(255,121,176,0.3);
}
[theme="昼光"]{
--bg-primary:rgba(255,252,245,0.95);--bg-secondary:rgba(250,245,235,0.85);--text-primary:#2d2a24;--text-secondary:#7d6a58;
--border-color:rgba(0,0,0,0.06);--kill:#ff4b4b;--card:rgba(255,255,255,0.9);--shadow:0 8px 32px rgba(0,0,0,0.08);
--gradient:linear-gradient(135deg,#fff9e6 0%,#fff5e6 100%);--particle:#3d2b1e;--neon:rgba(61,43,30,0.15);
}
body{background:var(--gradient);color:var(--text-primary);min-height:100vh;padding:12px;transition:all 0.3s ease;overflow-x:hidden}
#background{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-3;pointer-events:none}
.particle{position:absolute;border-radius:50%;background:var(--particle);box-shadow:0 0 12px var(--particle);opacity:0.25;animation:float 7s infinite ease-in-out}
@keyframes float{0%{transform:translate(0,0) scale(1);opacity:0.2}50%{transform:translate(30px,-40px) scale(1.3);opacity:0.4}100%{transform:translate(0,0) scale(1);opacity:0.2}}
.ray{position:absolute;width:2px;height:200px;background:linear-gradient(transparent,var(--particle),transparent);opacity:0.12;animation:ray 9s linear infinite}
@keyframes ray{0%{transform:translateY(-200px)}100%{transform:translateY(100vh)}}
.halo{position:absolute;width:100vmax;height:100vmax;border-radius:50%;background:radial-gradient(circle,var(--neon),transparent 70%);animation:pulse-glow 12s infinite ease-in-out}
@keyframes pulse-glow{0%{transform:scale(1);opacity:0.3}50%{transform:scale(1.1);opacity:0.5}100%{transform:scale(1);opacity:0.3}}
.glass{background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:20px;border:1px solid var(--border-color);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.container{max-width:900px;margin:0 auto;position:relative;transition: filter 0.3s;}
.theme-btn{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;background:var(--text-primary);color:var(--bg-primary);border:none;font-size:18px;cursor:pointer;z-index:999;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:all .2s}
.countdown-wrap{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0;}
.countdown{font-size:18px;font-weight:700;color:var(--danger);animation:blink 1s infinite alternate;padding:6px 12px;border-radius:12px;background:var(--bg-secondary);}
.countdown.highlight{background:var(--danger)!important;color:white!important;animation:blink .5s infinite alternate;}
.header{padding:20px;text-align:center}
.title{font-size:22px;font-weight:700;margin-bottom:8px}
.author{font-size:14px;color:var(--text-secondary)}
.lottery-info{padding:20px}
.info-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px}
.number-display{font-size:28px;font-weight:700;text-align:center;margin:15px 0;letter-spacing:2px}
.combination{display:inline-block;padding:6px 15px;background:var(--bg-secondary);border-radius:15px;font-size:16px;}
.three-box{padding:15px;background:var(--bg-secondary);border-radius:16px;margin-bottom:12px}
.three-item{display:flex;justify-content:space-between;padding:6px 0}
.main-result{padding:30px 20px;text-align:center;background:rgba(255,68,68,0.12);border:2px solid var(--kill);position:relative}
.main-text{font-size:30px;font-weight:700;color:var(--kill);animation:pulse 1.5s infinite}
.stats{padding:15px 20px;display:flex;justify-content:space-around;text-align:center;flex-wrap:wrap;gap:15px}
.stat-item{flex:1;min-width:80px;}
.stat-value{font-size:20px;font-weight:700;margin-bottom:5px}
.stat-label{font-size:12px;color:var(--text-secondary)}
.refresh-btn{width:100%;padding:12px;border-radius:15px;border:none;background:var(--text-primary);color:var(--bg-primary);font-size:16px;font-weight:700;cursor:pointer;margin-bottom:12px}
.refresh-btn:active{transform:scale(.98)}
.table-container{padding:15px;overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:600px;}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--border-color)}
th{background:var(--bg-secondary);font-weight:700;position:sticky;top:0}
.correct{color:var(--success);font-weight:700}
.wrong{color:var(--danger);font-weight:700}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes blink{to{opacity:.6}}
@media(max-width:600px){
.title{font-size:18px}.number-display{font-size:24px}.main-text{font-size:26px}
table{font-size:10px;min-width:400px;}th,td{padding:8px 4px}
}

/* 权限锁定模糊样式 */
.blur-lock{filter: blur(16px) brightness(0.6); pointer-events: none; user-select: none;}
/* 弹窗通用样式 */
.modal-mask{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.75);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    z-index:9999;
    display:flex;align-items:center;justify-content:center;padding:15px
}
.modal-box{width:100%;max-width:420px;background:var(--card);border-radius:20px;border:1px solid var(--border-color);padding:24px;box-shadow:var(--shadow)}
.modal-title{font-size:20px;font-weight:bold;margin-bottom:16px;text-align:center}
.modal-desc{font-size:14px;color:var(--text-secondary);margin-bottom:20px;line-height:1.6;text-align:center}
.modal-btn{width:100%;padding:12px;border-radius:14px;border:none;font-size:16px;font-weight:bold;cursor:pointer;margin:8px 0}
.btn-primary{background:var(--text-primary);color:var(--bg-primary)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.hidden{display:none!important}
</style>
</head>
<body theme="白银">
<div id="background"><div class="halo"></div></div>
<div class="container" id="mainWrap">
<button class="theme-btn" id="themeBtn">🔮</button>
<div class="glass header">
  <div class="title">发发</div>
  <div class="title">分分🌟9尾数杀组</div>
  <div class="author">旺旺848108099</div>
</div>
<div class="glass lottery-info">
  <div class="info-row">
    <div id="latest-period">最新期数：--</div>
    <div class="countdown-wrap"><div class="countdown" id="countdown">--:--</div></div>
  </div>
  <div class="number-display" id="latest-number">--+--+--</div>
  <div style="text-align:center"><div class="combination" id="latest-combination">--</div></div>
</div>
<div class="glass three-box" id="three-data">
  <div class="three-item">第1期：<span>--+--+--</span></div>
  <div class="three-item">第2期：<span>--+--+--</span></div>
  <div class="three-item">第3期：<span>--+--+--</span></div>
</div>
<div class="glass main-result">
  <div class="main-text" id="result-text">计算中...</div>
</div>
<div class="glass stats">
  <div class="stat-item"><div class="stat-value" id="total">0</div><div class="stat-label">总期数</div></div>
  <div class="stat-item"><div class="stat-value" id="correct">0</div><div class="stat-label">正确</div></div>
  <div class="stat-item"><div class="stat-value" id="wrong">0</div><div class="stat-label">错误</div></div>
  <div class="stat-item"><div class="stat-value" id="rate">0%</div><div class="stat-label">准确率</div></div>
</div>
<button class="refresh-btn" id="refresh">🔄刷新数据</button>
<div class="glass table-container">
  <table>
    <thead><tr><th>期数</th><th>开奖</th><th>组合</th><th>预测杀组</th><th>结果</th></tr></thead>
    <tbody id="table-body"><tr><td colspan="5">加载数据中...</td></tr></tbody>
  </table>
</div>
</div>

<!-- 访客申请弹窗 仅提交申请按钮 -->
<div id="applyModal" class="modal-mask">
  <div class="modal-box">
    <div class="modal-title">权限申请验证</div>
    <div class="modal-desc">点击下方按钮提交申请，等待管理员审核通过解锁全部算法与开奖内容</div>
    <button id="submitApplyBtn" class="modal-btn btn-primary">提交申请</button>
      <div class="modal-desc">旺旺：<span style="color:blue;">848108099</span></div>
  </div>
</div>

<!-- 提示弹窗 -->
<div id="tipModal" class="modal-mask hidden">
  <div class="modal-box">
    <div class="modal-title" id="tipTitle">提示</div>
    <div class="modal-desc" id="tipDesc"></div>
    <button id="tipCloseBtn" class="modal-btn btn-primary">确定</button>
  </div>
</div>

<script>
// ============原始开奖业务接口 完全不动============
const API_LATEST = "https://api.pgsoft.one/api/28/latest?type=fenfen28&limit=103";
const API_HISTORY = "https://api.pgsoft.one/api/28/history?type=fenfen28&page=1&limit=103";
// =================================================================
const themes = ["铂银","白银","黑钢","黑洞","混沌","昼光"];
let themeIdx = 1;
let dataList = [];
let nextOpenTime = 0;
let countdownTimer = null;
let dataRefreshTimer = null;
const killRule = ["小单","大双","小双","大单"];

// 直接用接口自带size+odd_even匹配组合，完全贴合你截图字段
function getComb(size, odd_even){
  if(size === "大" && odd_even === "单") return "大单";
  if(size === "大" && odd_even === "双") return "大双";
  if(size === "小" && odd_even === "单") return "小单";
  return "小双";
}

// 核心9尾数杀组算法 100%原版不动
function computeKill(n1,n2,n3){
  let a1=Number(n1[0]),a2=Number(n1[1]),a3=Number(n1[2]);
  let b2=Number(n2[1]);
  let c1=Number(n3[0]),c2=Number(n3[1]),c3=Number(n3[2]);
  let s1 = a1 + b2 + c3;
  let s2 = a2 + b2 + c2;
  let s3 = a3 + b2 + c1;
  let w1 = s1%10, w2 = s2%10, w3 = s3%10;
  let total = w1 + w2 + w3;
  let idx = total % 4;
  return killRule[idx];
}

async function loadData(){
  try{
    // 🔴 严格按照你截图JSON格式读取：外层对象 .data 数组
    const resLatest = await fetch(API_LATEST,{cache:"no-store"});
    const jsonLatest = await resLatest.json();
    const latestArr = jsonLatest.data;

    const resHist = await fetch(API_HISTORY,{cache:"no-store"});
    const jsonHist = await resHist.json();
    const histArr = jsonHist.data;

    // 合并去重排序
    let rawList = [...latestArr, ...histArr];
    // 期号去重
    let uniqueMap = {};
    rawList.forEach(item=>{uniqueMap[item.issue] = item;});
    rawList = Object.values(uniqueMap);
    // 按期号倒序，最新的排在最前面
    rawList.sort((a,b)=>Number(b.issue)-Number(a.issue));

    // 字段完美映射你截图里的 issue/balls/total/size/odd_even/time
    dataList = rawList.map(it=>{
      const num = it.balls;
      const sum = Number(it.total);
      const str = num.join("+");
      const comb = getComb(it.size, it.odd_even);
      // 时间戳转换
      const opentime = new Date(it.time).getTime();
      return {
        expect: it.issue,
        num,
        str,
        sum,
        comb: comb,
        time: opentime
      }
    });

    updateUI();
    makeTable();
    restartCountdown();
  }catch(e){
    console.log("数据加载失败：",e);
    document.getElementById("table-body").innerHTML = `<tr><td colspan="5">接口拉取失败，请点击刷新</td></tr>`;
  }
}

function updateUI(){
  if(!dataList.length)return;
  let now = dataList[0];
  document.querySelector("#latest-period").textContent=`最新期数：${now.expect}`;
  document.querySelector("#latest-number").textContent=now.str;
  document.querySelector("#latest-combination").textContent=now.comb;

  if(dataList.length>=3){
    document.querySelector("#three-data .three-item:nth-child(1) span").textContent=dataList[0].str;
    document.querySelector("#three-data .three-item:nth-child(2) span").textContent=dataList[1].str;
    document.querySelector("#three-data .three-item:nth-child(3) span").textContent=dataList[2].str;
    let kill = computeKill(dataList[0].num,dataList[1].num,dataList[2].num);
    document.querySelector("#result-text").textContent=`杀 ${kill}`;
  }
}

function makeTable(){
  if(dataList.length<4)return;
  let tb=document.querySelector("#table-body");tb.innerHTML="";
  let total=0,correct=0,wrong=0;
  for(let i=3;i<dataList.length;i++){
    try{
      let target=dataList[i-3];
      let p1=dataList[i-2].num,p2=dataList[i-1].num,p3=dataList[i].num;
      let kill=computeKill(p1,p2,p3);
      let ok=target.comb!==kill;
      total++;ok?correct++:wrong++;
      let tr=document.createElement("tr");
      tr.innerHTML=`<td>${target.expect}</td><td>${target.str}</td><td>${target.comb}</td><td>杀${kill}</td><td class="${ok?'correct':'wrong'}">${ok?"✅对":"❌错"}</td>`;
      tb.appendChild(tr);
    }catch(e){}
  }
  document.querySelector("#total").textContent=total;
  document.querySelector("#correct").textContent=correct;
  document.querySelector("#wrong").textContent=wrong;
  document.querySelector("#rate").textContent=total>0?((correct/total)*100).toFixed(1)+"%":"0%";
}

function restartCountdown(){
  if(!dataList.length)return;
  let last = dataList[0].time;
  nextOpenTime = last + 60000;
  if(countdownTimer)clearInterval(countdownTimer);
  countdownTimer = setInterval(renderCountdown,100);
}

function renderCountdown(){
  let now=Date.now();
  let diff=nextOpenTime-now;
  let cd=document.querySelector("#countdown");
  if(diff<=0){cd.textContent="🔄即将开奖";cd.classList.add("highlight");loadData();return;}
  let sec=Math.floor(diff/1000);
  let m=String(Math.floor(sec/60)).padStart(2,"0");
  let s=String(sec%60).padStart(2,"0");
  cd.textContent=`${m}:${s}`;
  cd.classList.toggle("highlight",sec<=10);
}

function createBg(){
  const bg=document.querySelector("#background");
  for(let i=0;i<70;i++){
    let p=document.createElement("div");p.className="particle";
    p.style.left=Math.random()*100+"%";p.style.top=Math.random()*100+"%";
    p.style.width=Math.random()*5+2+"px";p.style.height=p.style.width;
    p.style.animationDelay=Math.random()*7+"s";
    bg.appendChild(p);
  }
  for(let i=0;i<20;i++){
    let l=document.createElement("div");l.className="ray";
    l.style.left=Math.random()*100+"%";
    l.style.animationDelay=Math.random()*9+"s";
    bg.appendChild(l);
  }
}

document.querySelector("#themeBtn").onclick=()=>{
  themeIdx=(themeIdx+1)%themes.length;
  document.body.setAttribute("theme",themes[themeIdx]);
}
document.querySelector("#refresh").onclick=()=>loadData();

// 每秒自动刷新，严格按你的要求
window.onload=()=>{
  createBg();
  loadData();
  dataRefreshTimer=setInterval(loadData,1000);
}

// ====================== 权限JS 仅更换后端域名，删除全部管理员代码 ======================
const BACKEND_BASE = "https://w209512.pythonanywhere.com";
let userId = "";
let authorized = false;
const $ = s => document.querySelector(s);

// 生成设备唯一ID
function getUid(){
  let uid = localStorage.getItem("device_uid");
  if(!uid){
    uid = crypto.randomUUID();
    localStorage.setItem("device_uid", uid);
  }
  return uid;
}
// 授权通过 解锁页面关闭申请弹窗
function openAuth(){
  authorized = true;
  localStorage.setItem("auth_ok", "1");
  hideModal("#applyModal");
  $("#mainWrap").classList.remove("blur-lock");
}
// 撤销/拒绝权限 锁定页面弹出申请弹窗
function closeAuth(){
  authorized = false;
  localStorage.removeItem("auth_ok");
  $("#mainWrap").classList.add("blur-lock");
  showModal("#applyModal");
}
// 弹窗工具
function showModal(sel){ $(sel).classList.remove("hidden") }
function hideModal(sel){ $(sel).classList.add("hidden") }
function showTip(title, desc){
  $("#tipTitle").textContent = title;
  $("#tipDesc").textContent = desc;
  showModal("#tipModal");
}

// 仅手动点击按钮才提交申请，页面加载不会自动发起请求
async function submitApply(){
  userId = getUid();
  try{
    await fetch(`${BACKEND_BASE}/apply`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({userId})
    });
    showTip("提交成功", "申请已发送，请等待管理员审核");
  }catch(err){
    showTip("提交失败", "网络异常，请稍后重试");
  }
}
// 定时轮询权限状态，同步后端状态
async function checkAuthStatus(){
  userId = getUid();
  try{
    let res = await fetch(`${BACKEND_BASE}/status?userId=${userId}`);
    let data = await res.json();
    if(data.status === "allow"){
      openAuth();
    }else{
      closeAuth();
    }
  }catch(e){}
}

// 权限初始化、绑定事件
(function initAuth(){
  userId = getUid();
  if(localStorage.getItem("auth_ok") === "1"){
    authorized = true;
    hideModal("#applyModal");
    $("#mainWrap").classList.remove("blur-lock");
  }else{
    $("#mainWrap").classList.add("blur-lock");
    showModal("#applyModal");
  }
  // 3秒轮询一次权限状态
  setInterval(checkAuthStatus, 3000);

  // 按钮绑定
  $("#submitApplyBtn").onclick = submitApply;
  $("#tipCloseBtn").onclick = ()=>hideModal("#tipModal");
})();
</script>
</body>
</html>
