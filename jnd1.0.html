<script>
// 原有业务代码完全不动
const API_URL = "https://super.pc28998.com/history/JND28";
const themes = ["铂银","白银","黑钢","混沌"];
const COMBINATIONS = ["大单", "大双", "小单", "小双"];
const MAX_HISTORY = 100;
const UNCHARTED_THRESHOLD = 4;
let themeIndex = 1;
let lotteryData = [];
let autoTimer = null;
let countdownTimer = null;
let currentStrategy = "repeat";
let lockFewKill = "";

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("themeBtn").onclick = () => {
    themeIndex = (themeIndex + 1) % themes.length;
    document.body.setAttribute("theme", themes[themeIndex]);
  };
  document.getElementById("repeat-kill-btn").onclick = () => switchStrategy("repeat");
  document.getElementById("few-kill-btn").onclick = () => switchStrategy("few");
  document.getElementById("refresh-btn").addEventListener("click", () => {
    lotteryData = [];
    lockFewKill = "";
    loadData();
  });
  loadData();
  autoTimer = setInterval(loadData, 30000);
});

function switchStrategy(type) {
  currentStrategy = type;
  const repeatBtn = document.getElementById("repeat-kill-btn");
  const fewBtn = document.getElementById("few-kill-btn");
  if (type === "repeat") {
    repeatBtn.className = "switch-btn active";
    fewBtn.className = "switch-btn inactive";
    document.getElementById("current-strategy").textContent = "当前策略：重复组合杀组";
  } else {
    repeatBtn.className = "switch-btn inactive";
    fewBtn.className = "switch-btn active";
    document.getElementById("current-strategy").textContent = "当前策略：少数组合杀组";
    if (lotteryData.length) {
      const uncharted = calcUnchartedPeriods();
      lockFewKill = getColdestComb(uncharted);
    }
  }
  if (lotteryData.length) {
    const uncharted = calcUnchartedPeriods();
    const killResult = calcAIKill(uncharted);
    updateKillUI(killResult);
    renderHistoryTable();
  }
}

async function loadData() {
  try {
    const res = await fetch(API_URL, { cache: "no-cache" });
    const data = await res.json();
    if (data.code === 1 && Array.isArray(data.data) && data.data.length > 0) {
      lotteryData = data.data.map(item => {
        const code = item.opencode || "0,0,0";
        const nums = code.split(",").map(Number);
        const sum = nums.reduce((a, b) => a + b, 0);
        let comb = "小单";
        if (sum >= 14) {
          comb = sum % 2 === 0 ? "大双" : "大单";
        } else {
          comb = sum % 2 === 0 ? "小双" : "小单";
        }
        return {
          nbr: item.expect,
          number: code.replace(/,/g, "+"),
          combination: comb,
          num: sum
        };
      });
      updateBasicUI();
      const uncharted = calcUnchartedPeriods();
      const killResult = calcAIKill(uncharted);
      updateKillUI(killResult);
      renderHistoryTable();
    }
  } catch (e) {
    console.error("拉取失败", e);
    document.getElementById("history-table").innerHTML = `<tr><td colspan="7">数据拉取失败，点击刷新重试</td></tr>`;
  }
}

function updateBasicUI() {
  if (!lotteryData.length) return;
  const latest = lotteryData[0];
  document.getElementById("latest-period").textContent = `最新期数：${latest.nbr}`;
  document.getElementById("latest-number").textContent = latest.number;
  document.getElementById("latest-combination").textContent = latest.combination;
  const uncharted = calcUnchartedPeriods();
  const list = document.getElementById("uncharted-list").children;
  list[0].textContent = `大单：${uncharted.大单}期未开`;
  list[1].textContent = `大双：${uncharted.大双}期未开`;
  list[2].textContent = `小单：${uncharted.小单}期未开`;
  list[3].textContent = `小双：${uncharted.小双}期未开`;
  
  if (countdownTimer) clearInterval(countdownTimer);
  startCountdown("03:00");
  
  if (currentStrategy === "few" && lockFewKill && latest.combination === lockFewKill) {
    lockFewKill = "";
    const newUncharted = calcUnchartedPeriods();
    lockFewKill = getColdestComb(newUncharted);
  }
}

function startCountdown(timeStr) {
  if (!timeStr || timeStr === "--:--") {
    document.getElementById("countdown").textContent = "--:--";
    return;
  }
  const [m, s] = timeStr.split(":").map(Number);
  let minutes = m || 0;
  let seconds = s || 0;
  countdownTimer = setInterval(() => {
    seconds--;
    if (seconds < 0) {
      seconds = 59;
      minutes--;
    }
    if (minutes < 0) {
      clearInterval(countdownTimer);
      document.getElementById("countdown").textContent = "已开奖";
      lotteryData = [];
      setTimeout(loadData, 300);
      return;
    }
    const mm = String(minutes).padStart(2, "0");
    const ss = String(seconds).padStart(2, "0");
    document.getElementById("countdown").textContent = `${mm}:${ss}`;
  }, 1000);
}

function calcUnchartedPeriods() {
  const uncharted = { "大单":0, "大双":0, "小单":0, "小双":0 };
  COMBINATIONS.forEach(type => {
    let count = 0;
    for (let i = 0; i < lotteryData.length; i++) {
      if (lotteryData[i].combination !== type) count++;
      else break;
    }
    uncharted[type] = count;
  });
  return uncharted;
}

function getColdestComb(uncharted) {
  const coldCombs = COMBINATIONS.filter(type => uncharted[type] >= UNCHARTED_THRESHOLD);
  if (coldCombs.length === 0) {
    const fewCount = calcFivePeriodFew();
    return Object.keys(fewCount).sort((a,b) => fewCount[a] - fewCount[b])[0];
  }
  return coldCombs.sort((a,b) => uncharted[b] - uncharted[a])[0];
}

function calcFivePeriodFew() {
  const recent5 = lotteryData.slice(0, 5);
  const fewCount = { "大单":0, "大双":0, "小单":0, "小双":0 };
  recent5.forEach(item => fewCount[item.combination]++);
  return fewCount;
}

function calcAIKill(uncharted) {
  if (!lotteryData.length) return { kill: "数据不足", killType: "--", desc: "" };
  const latestComb = lotteryData[0].combination;
  let killType = "", desc = "";
  if (currentStrategy === "repeat") {
    killType = latestComb;
  } else {
    if (!lockFewKill) lockFewKill = getColdestComb(uncharted);
    killType = lockFewKill;
  }
  return { kill: `杀${killType}`, killType, desc: "" };
}

function updateKillUI(killResult) {
  document.getElementById("kill-result").textContent = killResult.kill;
  document.getElementById("lock-kill-type").textContent = killResult.killType;
}

function renderHistoryTable() {
  const tbody = document.getElementById("history-table");
  tbody.innerHTML = "<tr><td colspan='7'>计算中...</td></tr>";
  if (lotteryData.length < 2) {
    tbody.innerHTML = "<tr><td colspan='7'>数据不足</td></tr>";
    return;
  }
  const latestData = lotteryData.slice(0, MAX_HISTORY);
  tbody.innerHTML = "";
  let total = 0, correct = 0;
  let histLockFew = "";
  for (let i = latestData.length - 1; i > 0; i--) {
    try {
      const preData = latestData.slice(i);
      const current = latestData[i - 1];
      if (!current || !preData[0]) continue;
      const preLatestComb = preData[0].combination;
      const preUncharted = calcUnchartedPeriodsByData(preData);
      let killType = "", strategy = "";
      if (currentStrategy === "repeat") {
        strategy = "重复组合杀组";
        killType = preLatestComb;
      } else {
        strategy = "少数组合杀组";
        if (!histLockFew) histLockFew = getColdestCombByData(preData, preUncharted);
        if (preLatestComb === histLockFew) {
          histLockFew = getColdestCombByData(preData, preUncharted);
        }
        killType = histLockFew;
      }
      const isCorrect = killType !== current.combination;
      if (isCorrect) correct++;
      total++;
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${current.nbr}</td>
        <td>${current.number}</td>
        <td>${current.num}</td>
        <td>${current.combination}</td>
        <td>杀${killType}</td>
        <td>${strategy}</td>
        <td class="${isCorrect ? 'correct' : 'wrong'}">${isCorrect ? '正确' : '错误'}</td>
      `;
      tbody.prepend(tr);
    } catch (e) { continue; }
  }
  const accuracy = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;
  document.getElementById("total-count").textContent = total;
  document.getElementById("correct-count").textContent = correct;
  document.getElementById("accuracy").textContent = `${accuracy}%`;
}

function calcUnchartedPeriodsByData(data) {
  const uncharted = { "大单":0, "大双":0, "小单":0, "小双":0 };
  COMBINATIONS.forEach(type => {
    let count = 0;
    for (let i = 0; i < data.length; i++) {
      if (data[i].combination !== type) count++;
      else break;
    }
    uncharted[type] = count;
  });
  return uncharted;
}

function getColdestCombByData(data, uncharted) {
  const coldCombs = COMBINATIONS.filter(type => uncharted[type] >= UNCHARTED_THRESHOLD);
  if (coldCombs.length === 0) {
    const recent5 = data.slice(0, 5);
    const fewCount = { "大单":0, "大双":0, "小单":0, "小双":0 };
    recent5.forEach(item => fewCount[item.combination]++);
    return Object.keys(fewCount).sort((a,b) => fewCount[a] - fewCount[b])[0];
  }
  return coldCombs.sort((a,b) => uncharted[b] - uncharted[a])[0];
}

// ====================== 权限模块 完全照搬bt28弹窗逻辑 ======================
const BACKEND_BASE = "https://w209512.pythonanywhere.com";
let userId = "";
let authorized = false;
// 生成设备唯一ID
function getUid(){
  let uid = localStorage.getItem("device_uid");
  if(!uid){
    uid = crypto.randomUUID();
    localStorage.setItem("device_uid", uid);
  }
  return uid;
}
// 授权通过解锁页面，永久关闭弹窗
function openAuth(){
  authorized = true;
  localStorage.setItem("auth_ok", "1");
  hideModal("#applyModal");
  document.getElementById("mainWrap").classList.remove("blur-lock");
}
// 无权限锁定页面弹出申请弹窗
function closeAuth(){
  authorized = false;
  localStorage.removeItem("auth_ok");
  document.getElementById("mainWrap").classList.add("blur-lock");
  showModal("#applyModal");
}
// 弹窗工具
function showModal(sel){ document.querySelector(sel).classList.remove("hidden") }
function hideModal(sel){ document.querySelector(sel).classList.add("hidden") }
function showTip(title, desc){
  document.getElementById("tipTitle").textContent = title;
  document.getElementById("tipDesc").textContent = desc;
  showModal("#tipModal");
}
// 提交申请 POST携带标准json请求头
async function submitApply(){
  userId = getUid();
  try{
    await fetch(`${BACKEND_BASE}/apply`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({userId})
    });
    showTip("提交成功", "申请已发送，请等待管理员审核");
  }catch(err){
    showTip("提交失败", "网络异常，请稍后重试");
  }
}
// 轮询校验权限 GET仅拼接userId参数
async function checkAuthStatus(){
  userId = getUid();
  try{
    let res = await fetch(`${BACKEND_BASE}/status?userId=${userId}`);
    let data = await res.json();
    if(data.status === "allow"){
      openAuth();
    }else{
      closeAuth();
    }
  }catch(e){}
}
// 权限初始化
(function initAuth(){
  userId = getUid();
  if(localStorage.getItem("auth_ok") === "1"){
    authorized = true;
    hideModal("#applyModal");
    document.getElementById("mainWrap").classList.remove("blur-lock");
  }else{
    document.getElementById("mainWrap").classList.add("blur-lock");
    showModal("#applyModal");
  }
  // 3秒轮询一次权限
  setInterval(checkAuthStatus, 3000);
  // 按钮绑定
  document.getElementById("submitApplyBtn").onclick = submitApply;
  document.getElementById("tipCloseBtn").onclick = ()=>hideModal("#tipModal");
})();
</script>
